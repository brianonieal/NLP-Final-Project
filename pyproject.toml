# initial repo skeleton.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gram-sdpo"
version = "0.1.0"
description = "Gram loss regularization for self-distillation of a reasoning LLM."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Brian W. Onieal" },
    { name = "Morgan Zinn" },
    { name = "Rajiv Khandpur" },
]
dependencies = [
    "torch",
    "transformers>=4.51",
    "peft",
    "huggingface_hub",
    "pandas",
    "pyarrow",
    "pyyaml",
    "math-verify",
]

[project.scripts]
gram-sdpo-train = "gram_sdpo.train:main"
gram-sdpo-eval = "gram_sdpo.evaluate:main"
gram-sdpo-report = "gram_sdpo.report:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes. I: import order. D: docstrings on every
# function, method, and class. UP: modern syntax. B: common bugs.
select = ["E", "F", "I", "D", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"
